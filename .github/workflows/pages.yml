# Veroeffentlicht index.html unter https://<user>.github.io/<repo>/
#
# Laeuft nur auf main. Der Schritt configure-pages legt die Pages-Site
# beim ersten Durchlauf selbst an (enablement: true), es ist also kein
# Klick in den Repo-Einstellungen noetig — das Repo muss lediglich
# oeffentlich sein.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Deployments wuerden sich gegenseitig ueberholen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
